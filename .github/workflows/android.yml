name: LY Remote Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --org com.lyremote --project-name universal .

      - name: Install IR controller
        run: |
          mkdir -p android/app/src/main/kotlin/com/lyremote/universal
          cp native/android/MainActivity.kt android/app/src/main/kotlin/com/lyremote/universal/MainActivity.kt
          sed -i '/<application/i\    <uses-permission android:name="android.permission.TRANSMIT_IR" />\n    <uses-feature android:name="android.hardware.consumerir" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LY-REMOTE-UNIVERSAL-APK-V2
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          
